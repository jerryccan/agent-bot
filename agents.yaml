feishu:
  transport: "auto"
  appId: "${FEISHU_APP_ID}"
  appSecret: "${FEISHU_APP_SECRET}"
  useConsoleWhenMissingCredentials: true

console:
  enabled: true

agents:
  codex:
    kind: "codex"
    title: "Codex"
    command: "codex"
    args:
      - "app-server"
      - "--listen"
      - "stdio://"
    env: {}

  coco:
    title: "Coco"
    command: "coco"
    args:
      - "acp"
      - "serve"
    env: {}

  coco-yolo:
    title: "Coco YOLO"
    command: "coco"
    args:
      - "acp"
      - "serve"
      - "--yolo"
    env: {}

  example:
    title: "Example ACP Agent"
    command: "node"
    args:
      - "./examples/example-acp-agent.js"
    env: {}

defaults:
  agent: "codex"
  cwd: "."

storage:
  sqlitePath: "./data/acp-bot.sqlite"

logging:
  level: "info"
  path: "./logs/acp-bot.log"
