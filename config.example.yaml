feishu:
  appId: "${FEISHU_APP_ID}"
  appSecret: "${FEISHU_APP_SECRET}"
  userOpenId: "${FEISHU_USER_OPEN_ID}"
  # Set to false to require an @ mention before processing group messages.
  respondToAllGroupMessages: true

console:
  enabled: true

agents:
  codex:
    kind: "app-server"
    title: "Codex"
    command: "codex"
    args:
      - "app-server"
      - "--enable"
      - "goals"
      - "--listen"
      - "stdio://"
    env: {}

  coco:
    title: "Coco"
    command: "coco"
    args:
      - "acp"
      - "serve"
    env: {}

  coco-yolo:
    title: "Coco YOLO"
    command: "coco"
    args:
      - "acp"
      - "serve"
      - "--yolo"
    env: {}

  example:
    title: "Example ACP Agent"
    command: "node"
    args:
      - "./examples/example-acp-agent.js"
    env: {}

defaults:
  agent: "codex"
  cwd: "."

storage:
  sqlitePath: "./data/agent-bot.sqlite"

logging:
  level: "info"
  path: "./logs/agent-bot.log"
