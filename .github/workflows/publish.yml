name: Publish to npm

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'master' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    runs-on: ubuntu-latest
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Use an npm CLI with trusted publishing support
        run: npm install --global npm@11

      - run: npm ci

      - name: Inspect package version
        id: package
        shell: bash
        run: |
          set -euo pipefail

          package_name=$(node -p "require('./package.json').name")
          package_version=$(node -p "require('./package.json').version")
          release_tag="v${package_version}"

          if [[ "${package_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+$ ]]; then
            npm_dist_tag=alpha
            is_prerelease=true
          elif [[ "${package_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            npm_dist_tag=latest
            is_prerelease=false
          else
            echo "::error::Only stable or alpha semantic versions can be published automatically: ${package_version}"
            exit 1
          fi

          set +e
          registry_output=$(npm view "${package_name}@${package_version}" version --json 2>&1)
          registry_status=$?
          set -e

          if [[ ${registry_status} -eq 0 ]]; then
            should_publish=false
            echo "${package_name}@${package_version} is already published; skipping."
          elif grep -q "E404" <<<"${registry_output}"; then
            should_publish=true
            if ! grep -Fq "## [${package_version}]" CHANGELOG.md; then
              echo "::error::CHANGELOG.md must contain a ## [${package_version}] release section."
              exit 1
            fi
          else
            printf '%s\n' "${registry_output}"
            exit "${registry_status}"
          fi

          {
            echo "name=${package_name}"
            echo "version=${package_version}"
            echo "tag=${release_tag}"
            echo "npm_dist_tag=${npm_dist_tag}"
            echo "is_prerelease=${is_prerelease}"
            echo "should_publish=${should_publish}"
          } >> "${GITHUB_OUTPUT}"

      - name: Ensure release tag
        id: release_tag
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.package.outputs.tag }}
          SHOULD_PUBLISH: ${{ steps.package.outputs.should_publish }}
        run: |
          set -euo pipefail
          if git rev-parse --verify --quiet "refs/tags/${RELEASE_TAG}" >/dev/null; then
            tag_sha=$(git rev-list -n 1 "${RELEASE_TAG}")
            if [[ "${SHOULD_PUBLISH}" == "true" && "${tag_sha}" != "${RELEASE_SHA}" ]]; then
              echo "::error::${RELEASE_TAG} points to ${tag_sha}, expected ${RELEASE_SHA}."
              exit 1
            fi
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          elif [[ "${SHOULD_PUBLISH}" == "true" ]]; then
            git tag "${RELEASE_TAG}" "${RELEASE_SHA}"
            git push origin "refs/tags/${RELEASE_TAG}"
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi

      - if: steps.package.outputs.should_publish == 'true'
        run: npm run verify

      - if: steps.package.outputs.should_publish == 'true'
        run: npm run package:smoke

      - name: Publish package
        if: steps.package.outputs.should_publish == 'true'
        env:
          NPM_DIST_TAG: ${{ steps.package.outputs.npm_dist_tag }}
        run: npm publish --access public --tag "${NPM_DIST_TAG}"

      - name: Create GitHub Release
        if: steps.release_tag.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.package.outputs.tag }}
          IS_PRERELEASE: ${{ steps.package.outputs.is_prerelease }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "GitHub Release ${RELEASE_TAG} already exists; leaving it unchanged."
          else
            release_args=(--title "${RELEASE_TAG}" --generate-notes)
            if [[ "${IS_PRERELEASE}" == "true" ]]; then
              release_args+=(--prerelease)
            fi
            gh release create "${RELEASE_TAG}" "${release_args[@]}"
          fi
