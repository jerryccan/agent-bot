name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        node:
          - 22
          - 24

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm test

  package:
    name: Verify npm package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run package:smoke

      - name: Pack the verified package
        shell: bash
        run: |
          set -euo pipefail
          mkdir package-artifact
          npm pack --ignore-scripts --pack-destination package-artifact

      - name: Upload the verified package
        uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: package-artifact/*.tgz
          if-no-files-found: error
          retention-days: 7
